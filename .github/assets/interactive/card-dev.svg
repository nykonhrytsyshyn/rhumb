<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200.75 60.75">
  <style>
    :root {
      --color-bg: #39363f1e;
      --color-border: #3d444d78;
      --color-text: #fff;
      --color-icon: #8b949e;
    }

    .card {
      fill: var(--color-bg);
      stroke: var(--color-border);
      stroke-width: 0.75;
    }

    .icon {
      stroke: var(--color-icon);
    }

    .icon-arrow {
      fill: var(--color-icon);
    }

    .label {
      fill: var(--color-text);
    }

    .icon, .icon-arrow, .label {
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

