# ============================================================================ #
#                                Build Workflow                                #
# ============================================================================ #
# Verifies that the production web application builds (tsc + vite build, PWA   #
# included) on every push to dev and release, and on every pull request        #
# targeting either branch.                                                     #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]    - skips all workflows                                         #
#   [build-skip] - skips this workflow only                                    #
# ============================================================================ #

name: "CI: Build"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "*.config.*"
  pull_request:
    branches: ["dev", "release"]

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  # Check if the commit message / PR title contains skip tags
  check:
    name: "Skip Check"
    runs-on: "ubuntu-latest"
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Run: Check skip tags"
        id: "belay"
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[build-skip]"

  # Build the production bundle
  build:
    name: "Run"
    needs: "check"
    if: needs.check.outputs.should_skip != 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Run: Build"
        run: "pnpm run build"
