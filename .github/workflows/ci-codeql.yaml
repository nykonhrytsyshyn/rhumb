# ============================================================================ #
#                                CodeQL Workflow                               #
# ============================================================================ #
# Runs GitHub CodeQL security and quality analysis on every push to dev and    #
# release, on every pull request targeting either branch, and on a weekly      #
# schedule. Two languages are analyzed:                                        #
#  - javascript-typescript: the application and workspace packages             #
#  - actions: the workflow files themselves (script injection, unsafe          #
#    permissions, untrusted checkouts) - this repo ships release automation    #
#    that holds a token, so its workflows deserve the same scrutiny as code    #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip] - skips all workflows                                            #
#   [ql-skip] - skips this workflow only                                       #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "CI: CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]
  schedule:
    # Runs every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"

permissions:
  contents: "read"
  security-events: "write"

jobs:
  # Check if the commit message / PR title contains skip tags
  check:
    name: "Skip Check"
    runs-on: "ubuntu-latest"
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Run: Check skip tags"
        id: "belay"
        # Scheduled runs: always execute regardless of skip tags
        if: github.event_name != 'schedule'
        uses: OctalMesh/belay-action@v1
        with:
          signal_tags: "[ci-skip],[ql-skip]"

  # Perform CodeQL analysis
  analyze:
    name: "Analyze (${{ matrix.language }})"
    needs: "check"
    if: needs.check.outputs.should_skip != 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "actions"]

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Dependencies are only needed for JS/TS: with them installed the
      # extractor resolves workspace imports and types, which sharpens results
      - name: "Setup: pnpm"
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        if: matrix.language == 'javascript-typescript'
        run: "pnpm install --frozen-lockfile"

      - name: "Setup: Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          config-file: "./.github/codeql/codeql-config.yaml"
          languages: ${{ matrix.language }}
          build-mode: "none"

      - name: "Run: Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
