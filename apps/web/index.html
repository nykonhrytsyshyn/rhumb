<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Rhumb - flowcharts by standard</title>
    <meta
      name="description"
      content="Draw flowcharts from Mermaid-like text in the style required by standards."
    />
    <meta name="author" content="Nykon" />
    <link rel="canonical" href="https://rhumb.nykon.me" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          const dark =
            theme === "dark" ||
            ((theme === null || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* The default light theme stays. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
