<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rhumb - Flowcharts by standard</title>
    <meta
      name="description"
      content="Draw flowcharts from Mermaid-like text in the style required by standards."
    />
    <meta name="author" content="Nykon Hrytsyshyn" />
    <meta
      name="keywords"
      content="rhumb, flowchart, mermaid, standard, diagram"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="canonical" href="https://rhumb.nykon.me" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rhumb" />
    <meta property="og:title" content="Rhumb - Flowcharts by standard" />
    <meta
      property="og:description"
      content="Draw flowcharts from Mermaid-like text in the style required by standards."
    />
    <meta property="og:url" content="https://rhumb.nykon.me" />

    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rhumb - Flowcharts by standard" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rhumb - Flowcharts by standard" />
    <meta
      name="twitter:description"
      content="Draw flowcharts from Mermaid-like text in the style required by standards."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Rhumb - Flowcharts by standard" />

    <!-- Resource Hints -->
    <link
      rel="preconnect"
      href="https://static.cloudflareinsights.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />

    <!-- Favicons (light) -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-16.png"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-32.png"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-48.png"
      type="image/png"
      sizes="48x48"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-96.png"
      type="image/png"
      sizes="96x96"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicons (dark) -->
    <link
      rel="icon"
      href="/favicon-dark.ico"
      sizes="any"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-16.png"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-32.png"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-48.png"
      type="image/png"
      sizes="48x48"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-96.png"
      type="image/png"
      sizes="96x96"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
      type="image/png"
      sizes="180x180"
    />

    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          const dark =
            theme === "dark" ||
            ((theme === null || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* The default light theme stays. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
