<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rhumb - Flowcharts by standard</title>
    <meta
      name="description"
      content="Draw flowcharts from Mermaid-like text in the style required by standards."
    />
    <meta name="author" content="Nykon" />
    <link rel="canonical" href="https://rhumb.nykon.me" />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-16.png"
      sizes="16x16"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-48.png"
      sizes="48x48"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-96.png"
      sizes="96x96"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.ico"
      sizes="any"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-16.png"
      sizes="16x16"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-48.png"
      sizes="48x48"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark-96.png"
      sizes="96x96"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
      sizes="180x180"
      type="image/png"
    />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          const dark =
            theme === "dark" ||
            ((theme === null || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* The default light theme stays. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
